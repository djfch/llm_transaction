[project]
name = "llm-transaction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=0.117.0",
    "fastapi>=0.139.2",
    "gate-api>=7.2.100",
    "gate-ws>=0.5.6",
    "httpx>=0.28.1",
    "mcp>=2.0.0",
    "openai>=2.46.0",
    "pydantic>=2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 体量/复杂度机械门禁（对应 AGENTS.md 硬性规范 §2）：
# C901 圈复杂度、PLR0912 分支数、PLR0915 语句数（函数行数/嵌套深度的近似代理）
extend-select = ["C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
# 阈值 13 覆盖当前最高复杂度函数 update_tpsl
max-complexity = 13

[tool.ruff.lint.per-file-ignores]
# 路由工厂的复杂度/语句数来自端点注册数量（非嵌套逻辑），豁免体量规则
"src/server/routes_*.py" = ["C901", "PLR0915"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
