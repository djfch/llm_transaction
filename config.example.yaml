mode: paper
gate:
  settle: usdt
  testnet_host: https://api-testnet.gateapi.io/api/v4
  live_host: https://api.gateio.ws/api/v4
llm:
  provider: openai_compat
  model: deepseek-v4-flash
  max_tokens: 4096
  openai_base_url: https://api.deepseek.com
  max_consecutive_failures: 3
  # ── 多凭证（可选）──────────────────────────────────────────────
  # 登记多条凭证后，上方平铺的 provider/model/openai_base_url/max_tokens 不再生效，
  # 每个 agent 按下方 agents 段分配的凭证独立连接 LLM（互不影响、可单独热重建）。
  # key 明文不写在这里：每条凭证的 api_key_env 指定 .env 里的环境变量名
  # （留空自动推导为 LLM_KEY_<名称大写>），到监控页「密钥」里设置即可。
  # credentials:
  #   - name: main                 # 主号（决策用）
  #     provider: anthropic
  #     model: claude-sonnet-4-5
  #     max_tokens: 4096
  #     # api_key_env: 留空 → LLM_KEY_MAIN
  #   - name: backup               # 备用号（复盘用）
  #     provider: openai_compat
  #     model: deepseek-v4-flash
  #     openai_base_url: https://api.deepseek.com
  #     api_key_env: LLM_KEY_BACKUP
# 按 agent 分配凭证（值为 credentials 里的 name；不配 credentials 时只有 default 可选）
# agents:
#   trader:
#     credential: main             # 决策 agent 用主号
#   reviewer:
#     credential: backup           # 复盘 agent 用备用号
risk:
  max_position_pct: 0.3
  max_total_position_pct: 0.8
  max_leverage: 5
  daily_loss_limit: 0.1
  max_orders_per_day: 20
  max_deviation: 0.02
  kill_switch: false
scheduler:
  default_wake_minutes: 60
  min_wake_minutes: 5
  max_wake_minutes: 720
  autostart: false
paper:
  initial_equity: 10000.0
  slippage: 0.0005
notify:
  telegram_enabled: false
server:
  host: 127.0.0.1
  port: 17577
audit:
  dir: logs/audit
review:
  enabled: true
  daily_time: "03:00"  # 到达间隔天数后的触发时刻（本地 HH:MM）
  interval_days: 1  # 复盘间隔天数：每隔 N 天一次，区间为最近 N 天（1 = 每天）。
  # 注意：复盘失败也计入幂等记录（不自动重试，防 LLM 故障时每分钟重发），
  # 间隔设得越大，单次失败跨过的周期越长；可在监控页「立即复盘」手动补跑
log:
  dir: logs
  level: INFO
