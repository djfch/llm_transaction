name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: uv sync --frozen
      - name: 准备运行时配置（模板复制，部分测试用 build_app 默认路径读取）
        run: cp config.example.yaml config.yaml && cp watchlist.example.yaml watchlist.yaml && cp system_prompt.example.md system_prompt.md && cp review_prompt.example.md review_prompt.md
      - name: ruff check
        run: uv run ruff check src tests scripts
      - name: 单文件行数门禁（超 500 行失败）
        run: uv run python scripts/check_file_size.py
      - name: ruff format --check
        run: uv run ruff format --check src tests scripts
      - name: pytest（风控覆盖率 100% 门槛）
        run: uv run pytest tests/ --cov=src/risk --cov-fail-under=100 -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: 类型检查
        run: npx tsc --noEmit
      - name: Vitest
        run: npm run test
      - name: 构建
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: 安装后端依赖
        run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装前端依赖
        working-directory: web
        run: npm ci
      - name: 构建前端
        working-directory: web
        run: npm run build
      - name: 准备运行时配置（模板复制，文件不入库）
        run: cp config.example.yaml config.yaml && cp watchlist.example.yaml watchlist.yaml && cp system_prompt.example.md system_prompt.md && cp review_prompt.example.md review_prompt.md
      - name: 整机冒烟（真实端口 + dist 静态托管 + 操作链）
        run: uv run python scripts/e2e_web_smoke.py
